<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>配管ラインナップ管理 v4</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#eee;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{min-height:42px;border:1px solid #555;border-radius:7px;background:#242424;color:#fff;padding:7px 12px;cursor:pointer}
button:hover{background:#333}
button.primary{background:#315f9f;border-color:#4f82c5}
.app{max-width:1250px;margin:0 auto;padding:16px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.title{font-size:20px;font-weight:700;margin-right:auto}
.badge{padding:5px 9px;border-radius:999px;background:#292929;color:#bbb;font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}
.diagram{position:relative;background:#000;border:1px solid #333;border-radius:8px;overflow:hidden;line-height:0}
.diagram img{width:100%;height:auto;display:block}
.valve{position:absolute;width:6.8%;aspect-ratio:1;transform:translate(-50%,-50%);padding:0;border:0;border-radius:50%;background:transparent;min-height:0}
.valve::before{content:"";position:absolute;inset:5%;border-radius:50%;background:var(--c);border:2px solid #0b1116;box-shadow:0 0 0 1px #aaa;transform:scale(.8)}
.valve::after{content:"";position:absolute;inset:5%;border-radius:50%;background:
linear-gradient(45deg,transparent 43%,#050505 43.8%,#050505 56.2%,transparent 57%),
linear-gradient(-45deg,transparent 43%,#050505 43.8%,#050505 56.2%,transparent 57%);transform:scale(.62)}
.valve[data-state="open"]{--c:#1976d2}
.valve[data-state="closed"]{--c:#e53935}
.valve.selected::before{box-shadow:0 0 0 3px #fff,0 0 0 5px #315f9f}
.valve:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* 番号はバルブ本体とは独立した座標に置き、機材・配管に被らない位置へ配置 */
.valve .valve-label{
position:absolute;z-index:4;transform:translate(-50%,-50%);
white-space:nowrap;padding:2px 5px;border-radius:4px;
background:rgba(0,0,0,.82);color:#fff;
font:700 clamp(10px,1.55vw,15px)/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;
border:1px solid #777;line-height:1.1;pointer-events:none
}
.panel{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:13px}
.panel h2{font-size:16px;margin:0 0 10px}
.section{border-top:1px solid #333;padding-top:12px;margin-top:12px}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.small{font-size:12px;color:#aaa}
.state{font-weight:700}.blue{color:#4aa3ff}.red{color:#ff6262}
select,input{background:#111;color:#eee;border:1px solid #555;border-radius:6px;padding:8px;min-height:40px}
select{width:100%}input{width:100%}
.list{display:grid;gap:6px;max-height:260px;overflow:auto}
.item{display:flex;align-items:center;gap:6px;padding:7px;border:1px solid #333;border-radius:6px;background:#151515}
.item button{min-height:34px;padding:4px 8px}
.item .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{padding:9px;border-radius:6px;background:#202020;margin-top:7px}
.ok{border-left:4px solid #3da35a}.ng{border-left:4px solid #d9534f}
.legend{font-size:12px;color:#aaa;margin-top:8px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:3px}
.dot.b{background:#1976d2}.dot.r{background:#e53935}
.statusline{font-size:13px;color:#bbb}
.hint{max-width:1250px;margin:9px auto;color:#999;font-size:12px}
@media(max-width:850px){
.layout{grid-template-columns:1fr}.panel{order:-1}.list{max-height:none}
.app{padding:9px}.title{width:100%}
.valve .valve-label{font-size:10px;padding:1px 3px}
}
</style>
</head>
<body>
<div class="app" id="app">
<div class="top">
<div class="title">配管ラインナップ管理</div>
<span class="badge" id="countBadge">青 12 / 赤 0</span>
<button id="initialBtn" type="button">初期状態に戻す</button>
<button id="saveInitialBtn" type="button">現在を初期状態に設定</button>
<button id="copyImageBtn" type="button">画像をコピー</button>
</div>

<div class="row">
<input id="presetName" placeholder="例：循環開始前" aria-label="ラインナップ名">

</div>

</div>

</div>

<div class="row">
<button id="exportBtn" type="button">バックアップ出力</button>
<button id="importBtn" type="button">バックアップ読込</button>
<input id="fileInput" type="file" accept=".json" hidden>
</div>

</div>

</aside>
</div>

</div>

<script>
(() => {
const KEY="lineupValveAppV4";

/* 元画像 769×413px 基準。
   x,y = バルブ中心
   lx,ly = 表示番号の中心位置（機材・配管に被らないよう個別配置）
*/
const valveDefs=[
{id:"V01",x:214.218,y:116.775,lx:183,ly:91,note:""},
{id:"V02",x:312.243,y:116.778,lx:316,ly:91,note:""},
{id:"V03",x:399.161,y:69.364,lx:374,ly:43,note:""},
{id:"V04",x:510.777,y:68.326,lx:527,ly:43,note:""},
{id:"V05",x:409.776,y:117.803,lx:430,ly:98,note:""},
{id:"V06",x:362.772,y:182.028,lx:331,ly:181,note:""},
{id:"V07",x:458.774,y:149.407,lx:477,ly:147,note:""},
{id:"V08",x:217.259,y:220.784,lx:187,ly:217,note:""},
{id:"V09",x:259.687,y:245.265,lx:232,ly:258,note:""},
{id:"V10",x:590.593,y:264.074,lx:609,ly:258,note:""},
{id:"V11",x:559.352,y:319.720,lx:579,ly:313,note:""},
{id:"V12",x:618.965,y:346.230,lx:620,ly:379,note:""}
];

const defaultData={
states:Array(valveDefs.length).fill("open"),
initial:Array(valveDefs.length).fill("open"),
presets:[]
};
let data=load(),selected=-1;

function load(){
try{
const x=JSON.parse(localStorage.getItem(KEY)||"null");
if(!x)return structuredClone(defaultData);
return{
states:valveDefs.map((_,i)=>x.states?.[i]==="closed"?"closed":"open"),
initial:valveDefs.map((_,i)=>x.initial?.[i]==="closed"?"closed":"open"),
presets:Array.isArray(x.presets)?x.presets.filter(p=>p&&p.name&&Array.isArray(p.states)).map(p=>({
name:String(p.name).slice(0,80),
states:valveDefs.map((_,i)=>p.states[i]==="closed"?"closed":"open")
})):[]};
}catch(e){return structuredClone(defaultData)}
}
function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

const diagram=document.getElementById("diagram");
valveDefs.forEach((v,i)=>{
const b=document.createElement("button");
b.type="button";b.className="valve";b.dataset.i=i;
b.style.left=(v.x/769*100)+"%";b.style.top=(v.y/413*100)+"%";
b.title=v.id;
const label=document.createElement("span");
label.className="valve-label";
label.textContent=v.id;
label.setAttribute("aria-hidden","true");
label.style.left=(v.lx/769*100)+"%";
label.style.top=(v.ly/413*100)+"%";
b.appendChild(label);
b.addEventListener("click",()=>{
if(selected===i)data.states[i]=data.states[i]==="open"?"closed":"open";
else selected=i;
persist();render();
});
diagram.appendChild(b);
});

function render(){
document.querySelectorAll(".valve").forEach((b,i)=>{
b.dataset.state=data.states[i];
b.classList.toggle("selected",selected===i);
b.setAttribute("aria-label",`${valveDefs[i].id}：${data.states[i]==="open"?"青・開":"赤・閉"}`);
});
const blue=data.states.filter(s=>s==="open").length;
document.getElementById("countBadge").textContent=`青 ${blue} / 赤 ${data.states.length-blue}`;
const si=document.getElementById("selectedInfo");
if(selected<0)si.innerHTML="図中のバルブをクリックしてください。";
else{
const v=valveDefs[selected],st=data.states[selected];
si.innerHTML=`<strong>${v.id}</strong>　状態：<span class="state ${st==="open"?"blue":"red"}">${st==="open"?"青・開":"赤・閉"}</span>`;
}
renderPresets();updateStatus();
}

function renderPresets(){
const list=document.getElementById("presetList"),sel=document.getElementById("checkPreset"),old=sel.value;
list.innerHTML="";sel.innerHTML='<option value="">比較するラインナップを選択</option>';
data.presets.forEach((p,i)=>{
const item=document.createElement("div");item.className="item";
item.innerHTML=`<span class="name">${esc(p.name)}</span><button type="button" data-load="${i}">適用</button><button type="button" data-del="${i}">削除</button>`;
list.appendChild(item);
const o=document.createElement("option");o.value=i;o.textContent=p.name;sel.appendChild(o);
});
if([...sel.options].some(o=>o.value===old))sel.value=old;
list.querySelectorAll("[data-load]").forEach(b=>b.addEventListener("click",()=>{
data.states=[...data.presets[Number(b.dataset.load)].states];selected=-1;persist();render();check();
}));
list.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{
const i=Number(b.dataset.del);
if(confirm(`「${data.presets[i].name}」を削除しますか？`)){data.presets.splice(i,1);persist();render();}
}));
}

function check(){
const sel=document.getElementById("checkPreset"),idx=Number(sel.value),out=document.getElementById("checkResult");
if(!sel.value){out.innerHTML="";return}
const target=data.presets[idx];
if(!target){out.innerHTML="";return}
const diff=[];
valveDefs.forEach((v,i)=>{if(data.states[i]!==target.states[i])diff.push(`${v.id}：現在 ${data.states[i]==="open"?"青・開":"赤・閉"} / 目標 ${target.states[i]==="open"?"青・開":"赤・閉"}`)});
out.innerHTML=diff.length
?`<div class="check ng"><strong>不一致 ${diff.length}箇所</strong><br>${diff.map(esc).join("<br>")}</div>`
:`<div class="check ok"><strong>一致</strong><br>現在の12バルブ状態は登録ラインナップと一致しています。</div>`;
}

function updateStatus(){
const red=data.states.filter(s=>s==="closed").length;
document.getElementById("status").textContent=`登録ラインナップ：${data.presets.length}件　／　赤（閉）：${red}件`;
}

document.getElementById("initialBtn").addEventListener("click",()=>{
data.states=[...data.initial];selected=-1;persist();render();check();
});
document.getElementById("saveInitialBtn").addEventListener("click",()=>{
data.initial=[...data.states];persist();alert("現在の状態を初期状態として保存しました。");
});
document.getElementById("savePreset").addEventListener("click",()=>{
const input=document.getElementById("presetName"),name=input.value.trim();
if(!name){alert("ラインナップ名を入力してください。");input.focus();return}
data.presets.push({name,states:[...data.states]});
input.value="";persist();render();
});
document.getElementById("checkNow").addEventListener("click",check);
document.getElementById("checkPreset").addEventListener("change",check);

document.getElementById("copyImageBtn").addEventListener("click",async()=>{
try{
const img=diagram.querySelector("img");
if(!img.complete)await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject});

const canvas=document.createElement("canvas");
canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
const ctx=canvas.getContext("2d");
ctx.drawImage(img,0,0,canvas.width,canvas.height);

const sx=canvas.width/769, sy=canvas.height/413;
const valveDiameter=769*0.068*0.72*sx;
const borderWidth=Math.max(1,2*sx);
const shadowWidth=Math.max(1,1*sx);

valveDefs.forEach((v,i)=>{
const cx=v.x*sx,cy=v.y*sy,r=valveDiameter/2;
const color=data.states[i]==="open"?"#1976d2":"#e53935";
ctx.save();
ctx.beginPath();ctx.arc(cx,cy,r*0.95,0,Math.PI*2);
ctx.fillStyle=color;ctx.fill();
ctx.lineWidth=borderWidth;ctx.strokeStyle="#0b1116";ctx.stroke();
ctx.lineWidth=shadowWidth;ctx.strokeStyle="#aaa";ctx.stroke();
ctx.beginPath();
const xr=r*0.62;
ctx.moveTo(cx-xr,cy-xr);ctx.lineTo(cx+xr,cy+xr);
ctx.moveTo(cx+xr,cy-xr);ctx.lineTo(cx-xr,cy+xr);
ctx.lineWidth=Math.max(1,valveDiameter*0.055);ctx.strokeStyle="#050505";ctx.stroke();
ctx.restore();

const lx=v.lx*sx,ly=v.ly*sy;
const renderedLabel=document.querySelector(".valve-label");
const renderedFontSize=renderedLabel?parseFloat(getComputedStyle(renderedLabel).fontSize):15;
const fontSize=renderedFontSize*(canvas.width/diagram.getBoundingClientRect().width);
ctx.save();
ctx.font=`700 ${fontSize}px system-ui,-apple-system,"Segoe UI",sans-serif`;
ctx.textAlign="center";ctx.textBaseline="middle";
const textWidth=ctx.measureText(v.id).width;
const padX=5*sx,padY=2*sx,boxW=textWidth+padX*2,boxH=fontSize*1.1+padY*2;
ctx.fillStyle="rgba(0,0,0,.82)";ctx.strokeStyle="#777";ctx.lineWidth=Math.max(1,sx);
ctx.beginPath();
const x=lx-boxW/2,y=ly-boxH/2,radius=4*sx;
ctx.roundRect(x,y,boxW,boxH,radius);ctx.fill();ctx.stroke();
ctx.fillStyle="#fff";ctx.fillText(v.id,lx,ly);
ctx.restore();
});

const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error("PNG生成に失敗しました")),"image/png"));

/*
 * まず標準の Clipboard API を試す。
 * Chrome の file:// ページではこれが拒否される場合があるため、
 * その場合は「実際に表示されている img」を選択して execCommand(copy) を試す。
 */
let copied=false;
let clipboardError=null;
if(typeof ClipboardItem!=="undefined" && navigator.clipboard && typeof navigator.clipboard.write==="function"){
  try{
    await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);
    copied=true;
  }catch(e){clipboardError=e;console.warn("Clipboard API failed:",e);}
}

if(!copied){
  const objectUrl=URL.createObjectURL(blob);
  const holder=document.createElement("div");
  holder.contentEditable="true";
  holder.setAttribute("aria-hidden","true");
  holder.style.cssText="position:fixed;left:0;top:0;width:1px;height:1px;overflow:visible;z-index:2147483647;background:#fff;";
  const copiedImg=document.createElement("img");
  copiedImg.src=objectUrl;
  copiedImg.alt="";
  copiedImg.style.cssText="display:block;width:1px;height:1px;object-fit:contain;";
  holder.appendChild(copiedImg);
  document.body.appendChild(holder);

  try{
    await new Promise((resolve,reject)=>{
      if(copiedImg.complete) return resolve();
      copiedImg.onload=resolve; copiedImg.onerror=reject;
    });
    const range=document.createRange();
    range.selectNode(copiedImg);
    const selection=window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    holder.focus({preventScroll:true});
    copied=document.execCommand("copy");
    selection.removeAllRanges();
  }catch(e){
    clipboardError=e;
  }finally{
    URL.revokeObjectURL(objectUrl);
    holder.remove();
  }
}

if(!copied){
  /*
   * file:// の Chrome が両方の方法を拒否する場合、ブラウザのセキュリティ上
   * JavaScriptだけでOSクリップボードへ画像を書き込むことはできない。
   * この場合は明確な案内を表示する。
   */
  throw new Error("このChrome環境では画像クリップボードへの書き込みがブラウザに拒否されています。GitHub Pagesまたはlocalhostで開くとコピーできます。",{cause:clipboardError});
}

document.getElementById("status").textContent="表示中の画像をクリップボードにコピーしました。";
}catch(err){
console.error(err);
alert("画像をクリップボードにコピーできませんでした。\n\nChromeでHTMLを直接開いている場合は、GitHub Pages上で開くか、localhost経由で開くと画像コピーが利用できます。\n\n※これはChromeのfile://ページに対するクリップボード制限によるものです。");
}
});

a.download="valve-lineup-backup.json";a.click();URL.revokeObjectURL(a.href);

data={

};
r.readAsText(f,"utf-8");e.target.value="";
});
